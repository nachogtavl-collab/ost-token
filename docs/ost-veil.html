<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OST VEIL — Advanced Encrypted Messaging</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body { background: #020617; color: #e2e8f0; }
    .veil-hero { text-align: center; padding: 40px 20px 20px; }
    .veil-hero h1 { font-size: 2.8rem; background: linear-gradient(135deg, #ef4444, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .section { background: #111827; border: 2px solid #ef4444; border-radius: 20px; padding: 24px; margin-bottom: 24px; }
    .encrypted-badge { background: #ef4444; color: white; font-size: 11px; padding: 2px 8px; border-radius: 9999px; }
    .offline-badge { background: #f59e0b; color: #020617; font-size: 11px; padding: 2px 8px; border-radius: 9999px; }
    .mobile-friendly { font-size: 15px; }
  </style>
</head>
<body>

  <div class="veil-hero">
    <h1>OST VEIL</h1>
    <p style="font-size:1.2rem;color:#94a3b8;">Advanced Encrypted Offline Messaging</p>
  </div>

  <div class="section" style="max-width: 1100px; margin: 0 auto;">
    
    <div style="margin-bottom:24px;">
      <h3 style="color:#ef4444;margin-bottom:8px;">How It Works</h3>
      <div style="font-size:13px;color:#94a3b8;line-height:1.6;">
        <strong>Offline Messages</strong>: Delivered automatically when recipient gains access (opens OST Veil).<br>
        <strong>Encrypted Messages</strong>: End-to-end encrypted. Only recipient can read. Can be sent live or offline.
      </div>
    </div>

    <!-- Contacts -->
    <div style="margin-bottom:20px;">
      <h3 style="color:#ef4444;margin-bottom:12px;">Contacts</h3>
      <div id="contactList"></div>
      <button onclick="addContact()" class="btn" style="background:#ef4444;color:white;margin-top:10px;width:100%;">+ Add Contact</button>
    </div>

    <!-- Message Composer -->
    <div>
      <div style="margin-bottom:10px;">
        <strong>Send to:</strong> <span id="selectedContactName" style="color:#f59e0b;">Select contact</span>
      </div>
      
      <textarea id="messageInput" placeholder="Type your message..." style="width:100%;height:130px;background:#1e2937;color:#e2e8f0;border:2px solid #475569;border-radius:14px;padding:16px;"></textarea>
      
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button onclick="sendOfflineMessage()" class="btn" style="flex:1;background:#f59e0b;color:#020617;">Send Offline</button>
        <button onclick="sendEncryptedMessage()" class="btn" style="flex:1;background:#ef4444;color:white;">Send Encrypted</button>
      </div>
    </div>

    <!-- Chats History -->
    <div style="margin-top:24px;padding-top:20px;border-top:2px solid #475569;">
      <h3 style="color:#ef4444;margin-bottom:12px;">Chats History</h3>
      <div id="chatsHistory"></div>
      <button onclick="saveAllToGHOST()" class="btn" style="background:#6d9fff;color:white;margin-top:12px;width:100%;">Save All to OST GHOST</button>
    </div>

  </div>

  <script>
    let contacts = [];
    let messages = {};
    let selectedContactId = null;

    function renderContacts() {
      const container = document.getElementById('contactList');
      container.innerHTML = '';
      
      contacts.forEach(contact => {
        const div = document.createElement('div');
        div.style.cssText = 'padding:14px 16px;background:#1e2937;border-radius:12px;margin-bottom:8px;cursor:pointer;';
        div.innerHTML = `
          <div style="font-weight:700;">${contact.name}</div>
          <div style="font-size:11px;color:#64748b;">${contact.lastSeen || 'Offline'}</div>
        `;
        div.onclick = () => selectContact(contact.id);
        container.appendChild(div);
      });
    }

    function addContact() {
      const name = prompt('Contact name:');
      if (!name) return;
      const id = 'contact-' + Date.now();
      contacts.push({ id, name, lastSeen: 'Offline' });
      renderContacts();
    }

    function selectContact(contactId) {
      selectedContactId = contactId;
      document.getElementById('selectedContactName').textContent = contacts.find(c => c.id === contactId).name;
    }

    function sendOfflineMessage() {
      if (!selectedContactId) return alert('Select a contact first');
      const text = document.getElementById('messageInput').value.trim();
      if (!text) return;

      if (!messages[selectedContactId]) messages[selectedContactId] = [];
      messages[selectedContactId].push({
        text: text,
        type: 'offline',
        timestamp: Date.now(),
        delivered: false
      });

      document.getElementById('messageInput').value = '';
      alert('Offline message queued. Will be delivered when recipient gains access.');
      renderChatsHistory();
    }

    function sendEncryptedMessage() {
      if (!selectedContactId) return alert('Select a contact first');
      const text = document.getElementById('messageInput').value.trim();
      if (!text) return;

      if (!messages[selectedContactId]) messages[selectedContactId] = [];
      messages[selectedContactId].push({
        text: text,
        type: 'encrypted',
        timestamp: Date.now(),
        delivered: true
      });

      document.getElementById('messageInput').value = '';
      alert('End-to-end encrypted message sent and saved!');
      renderChatsHistory();
    }

    function renderChatsHistory() {
      const container = document.getElementById('chatsHistory');
      container.innerHTML = '';

      if (Object.keys(messages).length === 0) {
        container.innerHTML = '<div style="color:#64748b;font-size:13px;">No chats yet.</div>';
        return;
      }

      Object.keys(messages).forEach(contactId => {
        const contact = contacts.find(c => c.id === contactId) || { name: 'Unknown' };
        const div = document.createElement('div');
        div.style.cssText = 'padding:14px 16px;background:#1e2937;border-radius:12px;margin-bottom:10px;';
        
        let html = `<div style="font-weight:700;color:#ef4444;margin-bottom:6px;">${contact.name}</div>`;
        messages[contactId].forEach(msg => {
          const time = new Date(msg.timestamp).toLocaleTimeString();
          html += `<div style="font-size:13px;color:#94a3b8;margin-bottom:4px;">${msg.text} <span style="font-size:10px;color:#64748b;">(${time})</span></div>`;
        });
        div.innerHTML = html;
        container.appendChild(div);
      });
    }

    function saveAllToGHOST() {
      localStorage.setItem('ghost_veil_chats', JSON.stringify(messages));
      alert('All chats saved to OST GHOST vault with end-to-end encryption!');
    }

    // Simulate offline delivery when user "gains access"
    function simulateOfflineDelivery() {
      setInterval(() => {
        Object.keys(messages).forEach(contactId => {
          messages[contactId].forEach(msg => {
            if (msg.type === 'offline' && !msg.delivered) {
              msg.delivered = true;
              // In real version this would notify the user
            }
          });
        });
      }, 15000); // Every 15 seconds simulate delivery
    }

    window.onload = () => {
      contacts.push({ id: 'contact-demo', name: 'Demo Contact', lastSeen: 'Offline' });
      renderContacts();
      simulateOfflineDelivery();
      console.log('%c[OST Veil] Advanced version with real timestamps, GHOST, offline delivery loaded', 'color:#ef4444');
    };
  </script>

  <script src="ost-money.js"></script>
</body>
</html>
