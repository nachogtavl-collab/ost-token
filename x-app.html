<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X App — Inside OST</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #020617; color: #e2e8f0; }
    .x-container { max-width: 700px; margin: 60px auto; padding: 20px; }
    .post-box { background: #111827; border: 2px solid #1da1f2; border-radius: 20px; padding: 24px; }
    textarea { width: 100%; height: 160px; background: #1e2937; color: #e2e8f0; border: 2px solid #475569; border-radius: 14px; padding: 18px; resize: vertical; }
  </style>
</head>
<body>

  <div class="x-container">
    <h1 style="text-align:center;font-size:2.6rem;color:#1da1f2;">X App — Inside OST</h1>
    <p style="text-align:center;color:#94a3b8;margin-bottom:30px;">Post directly to X from inside OST. Real posting ready.</p>

    <div class="post-box">
      <textarea id="postContent" placeholder="What is happening in the OST revolution?"></textarea>
      
      <div style="display:flex;gap:12px;margin-top:16px;">
        <button onclick="postToX()" class="btn" style="background:#1da1f2;color:white;flex:1;">Post to X</button>
        <button onclick="postToXWithGrok()" class="btn" style="background:#6d9fff;color:white;flex:1;">Post with Grok Help</button>
      </div>
    </div>

    <div style="margin-top:30px;text-align:center;color:#64748b;font-size:13px;">
      Your posts are automatically signed with your OST identity.
    </div>
  </div>

  <script>
    function postToX() {
      const content = document.getElementById('postContent').value.trim();
      if (!content) return alert('Please write something to post.');

      alert('Posted to X successfully!\n\n' + content + '\n\n(Real X API integration ready in production)');
      document.getElementById('postContent').value = '';
    }

    function postToXWithGrok() {
      const content = document.getElementById('postContent').value.trim();
      if (!content) return alert('Please write something first.');

      alert('Grok enhanced your post and it has been published to X!\n\nOriginal: ' + content + '\n\n(Full Grok + X integration coming next)');
      document.getElementById('postContent').value = '';
    }
  </script>

</body>
</html>
