<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OST Mesh — Real-Time Sovereign Network</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #020617; color: #e2e8f0; }
    .mesh-hero { text-align: center; padding: 60px 20px 40px; }
    .mesh-hero h1 { font-size: 3.2rem; background: linear-gradient(135deg, #a78bfa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .mesh-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .peer-list { background: #111827; border: 2px solid #475569; border-radius: 20px; padding: 24px; }
    .chat-window { background: #0f172a; border: 2px solid #a78bfa; border-radius: 20px; padding: 24px; height: 420px; overflow-y: auto; }
    .message { margin-bottom: 16px; }
    .message.sent { text-align: right; }
    .message-bubble { display: inline-block; padding: 12px 18px; border-radius: 18px; max-width: 70%; }
    .sent .message-bubble { background: #34d399; color: #020617; }
    .received .message-bubble { background: #334155; }
  </style>
</head>
<body>

  <div class="mesh-hero">
    <h1>OST MESH</h1>
    <p style="font-size:1.3rem;color:#94a3b8;">Real-Time Sovereign Social Network</p>
    <p style="max-width:620px;margin:20px auto 0;color:#64748b;">Connect directly. Chat instantly. No servers. No censorship. Pure peer-to-peer on Solana.</p>
  </div>

  <div class="mesh-container">
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:24px;">
      
      <!-- Peer List -->
      <div class="peer-list">
        <h3 style="margin-top:0;color:#a78bfa;">Connected Peers</h3>
        <div id="peerList" style="margin-top:16px;"></div>
        
        <div style="margin-top:24px;">
          <button onclick="addPeer()" class="btn" style="width:100%;background:#a78bfa;color:white;margin-bottom:10px;">+ Add Peer Manually</button>
          <button onclick="scanQR()" class="btn" style="width:100%;background:#475569;color:white;">Scan QR Code</button>
        </div>
      </div>

      <!-- Chat Area -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div>
            <strong>Chat with:</strong> <span id="currentPeer" style="color:#34d399;">Select a peer</span>
          </div>
          <button onclick="startVoiceCall()" class="btn" style="background:#34d399;color:#020617;font-size:13px;padding:8px 18px;">Voice Call</button>
        </div>

        <div class="chat-window" id="chatWindow"></div>

        <div style="display:flex;gap:12px;margin-top:16px;">
          <input type="text" id="messageInput" placeholder="Type your message..." style="flex:1;padding:14px 18px;border-radius:9999px;background:#1e2937;color:#e2e8f0;border:2px solid #475569;" onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()" class="btn" style="background:#34d399;color:#020617;">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let peers = [];
    let currentPeerId = null;
    let messages = {};

    function renderPeers() {
      const container = document.getElementById('peerList');
      container.innerHTML = '';
      
      if (peers.length === 0) {
        container.innerHTML = '<div style="color:#64748b;font-size:13px;">No peers connected yet. Add someone or scan a QR.</div>';
        return;
      }

      peers.forEach(peer => {
        const div = document.createElement('div');
        div.style.cssText = 'padding:12px 16px;background:#1e2937;border-radius:12px;margin-bottom:8px;cursor:pointer;';
        div.innerHTML = `
          <div style="font-weight:700;">${peer.name}</div>
          <div style="font-size:12px;color:#64748b;">${peer.id}</div>
        `;
        div.onclick = () => selectPeer(peer.id);
        container.appendChild(div);
      });
    }

    function addPeer() {
      const name = prompt('Peer name:');
      if (!name) return;
      const id = 'peer-' + Date.now();
      peers.push({ id, name });
      renderPeers();
      alert('Peer added! They are now connected via OST Mesh.');
    }

    function scanQR() {
      alert('QR Scanner opened (demo). In production this would use the camera to scan a peer\'s QR code and auto-connect.');
      // Simulate adding a peer
      const demoPeer = { id: 'peer-qr-' + Date.now(), name: 'Scanned Peer' };
      peers.push(demoPeer);
      renderPeers();
    }

    function selectPeer(peerId) {
      currentPeerId = peerId;
      document.getElementById('currentPeer').textContent = peers.find(p => p.id === peerId).name;
      renderChat();
    }

    function renderChat() {
      const container = document.getElementById('chatWindow');
      container.innerHTML = '';
      
      if (!currentPeerId || !messages[currentPeerId]) {
        container.innerHTML = '<div style="color:#64748b;text-align:center;padding-top:60px;">No messages yet. Start chatting!</div>';
        return;
      }

      messages[currentPeerId].forEach(msg => {
        const div = document.createElement('div');
        div.className = `message ${msg.sent ? 'sent' : 'received'}`;
        div.innerHTML = `<div class="message-bubble">${msg.text}</div>`;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      if (!input.value.trim() || !currentPeerId) return;

      if (!messages[currentPeerId]) messages[currentPeerId] = [];
      messages[currentPeerId].push({ text: input.value, sent: true });
      
      renderChat();
      input.value = '';

      // Simulate reply
      setTimeout(() => {
        if (messages[currentPeerId]) {
          messages[currentPeerId].push({ text: 'Got it! (simulated reply)', sent: false });
          renderChat();
        }
      }, 1200);
    }

    function startVoiceCall() {
      if (!currentPeerId) return alert('Select a peer first');
      alert('Voice call started with ' + peers.find(p => p.id === currentPeerId).name + ' (WebRTC demo)');
    }

    // Demo: Add one peer on load
    window.onload = () => {
      peers.push({ id: 'peer-demo', name: 'Demo Peer (Satellite Node)' });
      renderPeers();
      console.log('%c[OST Mesh] Revolutionary real-time Mesh system loaded', 'color:#a78bfa');
    };
  </script>

</body>
</html>
