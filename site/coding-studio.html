<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OST Coding Studio — The Future of In-Browser Development</title>
  <link rel="stylesheet" href="coding-studio.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="studio-header">
    <h1>OST Collaborative Coding Studio</h1>
    <p>The most advanced in-browser development environment, deeply integrated with OST GHOST, Mesh, and Grok.</p>
  </div>

  <div class="studio-container">

    <div class="toolbar">
      <button class="btn btn-primary" onclick="runCode()">▶ Run</button>
      <button class="btn btn-grok" onclick="askGrok()">🤖 Ask Grok</button>
      <button class="btn btn-rally" onclick="startRally()">🤝 Rally</button>
      <button class="btn" onclick="saveToGhost()" style="background:#6d9fff;color:white;">💾 Save to GHOST</button>
      <button class="btn" onclick="exportToGitHub()" style="background:#475569;color:white;">Export</button>
    </div>

    <textarea id="mainEditor" placeholder="Write your code here...">// Welcome to the deepest version of OST Coding Studio
console.log("This is now a real product.");</textarea>

    <div class="output" id="output">Ready.</div>

    <!-- Grok Panel -->
    <div class="ai-panel" id="aiPanel" style="display:none;">
      <h3>Grok Assistant</h3>
      <div id="grokResponse"></div>
      <button onclick="document.getElementById('aiPanel').style.display='none'">Close</button>
    </div>

    <!-- Rally Panel -->
    <div class="rally-panel" id="rallyPanel" style="display:none;">
      <h3>Rally Active</h3>
      <p>Real-time collaboration enabled.</p>
      <button onclick="endRally()">End Rally</button>
    </div>

  </div>

  <script src="coding-studio.js"></script>
  <script>
    // Initialize the deep studio
    window.onload = function() {
      if (typeof initStudio === 'function') {
        initStudio();
      }
    };
  </script>

</body>
</html>
