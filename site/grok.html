<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok — Inside OST</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #020617; color: #e2e8f0; }
    .grok-container { max-width: 900px; margin: 60px auto; padding: 20px; }
    .chat-box { background: #111827; border: 2px solid #6d9fff; border-radius: 20px; padding: 24px; height: 520px; overflow-y: auto; }
    .message { margin-bottom: 16px; }
    .user { text-align: right; }
    .grok { text-align: left; }
    .bubble { display: inline-block; padding: 14px 20px; border-radius: 18px; max-width: 75%; }
    .user .bubble { background: #6d9fff; color: #020617; }
    .grok .bubble { background: #1e2937; }
  </style>
</head>
<body>

  <div class="grok-container">
    <h1 style="text-align:center;font-size:2.6rem;background:linear-gradient(135deg,#6d9fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Grok — Inside OST</h1>
    <p style="text-align:center;color:#94a3b8;margin-bottom:30px;">Full Grok chat interface. Ask anything. Get real answers.</p>

    <div class="chat-box" id="chatBox"></div>

    <div style="display:flex;gap:12px;margin-top:16px;">
      <input type="text" id="userInput" placeholder="Ask Grok anything..." style="flex:1;padding:16px 20px;border-radius:9999px;background:#1e2937;color:#e2e8f0;border:2px solid #475569;" onkeypress="if(event.key==='Enter') sendToGrok()">
      <button onclick="sendToGrok()" class="btn" style="background:#6d9fff;color:white;">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'grok'}`;
      div.innerHTML = `<div class="bubble">${text}</div>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendToGrok() {
      const input = document.getElementById('userInput');
      if (!input.value.trim()) return;

      addMessage(input.value, true);
      const question = input.value;
      input.value = '';

      // Simulate Grok response (in production this would call real Grok API)
      setTimeout(() => {
        let response = '';
        if (question.toLowerCase().includes('ost')) {
          response = 'OST is the revolutionary confidential layer that will dominate Solana. We are attacking on all fronts right now.';
        } else if (question.toLowerCase().includes('mesh')) {
          response = 'OST Mesh is the real-time sovereign social network. Fully peer-to-peer, no servers, no censorship.';
        } else {
          response = 'I understand. How can I help you build the future with OST today?';
        }
        addMessage(response, false);
      }, 900);
    }

    // Welcome message
    window.onload = () => {
      addMessage('Hello! I am Grok, integrated inside OST. How can I help you conquer today?', false);
    };
  </script>

</body>
</html>
