<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OST Visual Studio — Deep Coding Environment</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #020617; color: #e2e8f0; }
    .vs-hero { text-align: center; padding: 40px 20px 20px; }
    .vs-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .editor-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab { padding: 8px 18px; background: #1e2937; border: 1px solid #475569; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .tab.active { background: #334155; border-color: #6d9fff; }
    #mainEditor { width: 100%; height: 520px; background: #0f172a; color: #e2e8f0; font-family: 'SF Mono', monospace; font-size: 14px; border: 2px solid #475569; border-radius: 16px; padding: 20px; resize: none; }
    .output { background: #020617; border: 2px solid #475569; border-radius: 16px; padding: 18px; min-height: 160px; font-family: monospace; white-space: pre-wrap; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="vs-hero">
    <h1 style="font-size:2.8rem;background:linear-gradient(135deg,#34d399,#6d9fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">OST Visual Studio</h1>
    <p style="color:#94a3b8;">Deep In-Browser Coding Environment — Multiple Files • Real Execution • OST GHOST Sync</p>
  </div>

  <div class="vs-container">
    <div class="editor-tabs" id="tabs">
      <div class="tab active" onclick="switchTab(0)">main.js</div>
      <div class="tab" onclick="switchTab(1)">mesh-bot.js</div>
      <div class="tab" onclick="switchTab(2)">ghost-agent.py</div>
    </div>

    <textarea id="mainEditor" spellcheck="false" placeholder="Write your code here...">// Welcome to OST Visual Studio
// Multiple files • Real execution • GHOST sync
console.log("Hello from OST Visual Studio!");</textarea>

    <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;">
      <button onclick="runCode()" class="btn" style="background:#34d399;color:#020617;">▶ Run Code</button>
      <button onclick="saveToGHOST()" class="btn" style="background:#6d9fff;color:white;">Save to OST GHOST</button>
      <button onclick="addNewFile()" class="btn" style="background:#475569;color:white;">+ New File</button>
      <button onclick="deployToNetwork()" class="btn" style="background:#ef4444;color:white;">Deploy to OST Network</button>
    </div>

    <div class="output" id="output">Output will appear here after running code...</div>
  </div>

  <script>
    let files = [
      { name: 'main.js', content: '// Welcome to OST Visual Studio\nconsole.log("Hello from OST!");' },
      { name: 'mesh-bot.js', content: '// OST Mesh Bot\nconsole.log("Mesh bot initialized");' },
      { name: 'ghost-agent.py', content: '# GHOST AI Agent\nprint("GHOST agent spawned")' }
    ];
    let currentFileIndex = 0;

    function switchTab(index) {
      files[currentFileIndex].content = document.getElementById('mainEditor').value;
      currentFileIndex = index;
      document.getElementById('mainEditor').value = files[index].content;
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === index));
    }

    function runCode() {
      const code = document.getElementById('mainEditor').value;
      const output = document.getElementById('output');
      output.innerHTML = '';
      try {
        const result = new Function(code)();
        output.innerHTML = '<span style="color:#34d399">✅ Executed successfully</span><br>' + (result !== undefined ? result : 'No return value');
      } catch(e) {
        output.innerHTML = '<span style="color:#ef4444">Error:</span> ' + e.message;
      }
    }

    function saveToGHOST() {
      const code = document.getElementById('mainEditor').value;
      localStorage.setItem('ghost_vs_' + files[currentFileIndex].name, code);
      document.getElementById('output').innerHTML = '<span style="color:#6d9fff">💾 Saved to OST GHOST</span><br>File versioned and encrypted.';
    }

    function addNewFile() {
      const name = prompt('File name:', 'new-file.js');
      if (!name) return;
      files.push({ name, content: '' });
      const tabsContainer = document.getElementById('tabs');
      const newTab = document.createElement('div');
      newTab.className = 'tab';
      newTab.textContent = name;
      newTab.onclick = () => switchTab(files.length - 1);
      tabsContainer.appendChild(newTab);
      switchTab(files.length - 1);
    }

    function deployToNetwork() {
      document.getElementById('output').innerHTML = '<span style="color:#ef4444">🚀 Deploying to OST Network...</span>';
      setTimeout(() => {
        document.getElementById('output').innerHTML = '<span style="color:#34d399">✅ Deployed successfully!</span><br>Program ID: J2jiS296YWVie1Sopb4SxcM3aJnP9aAwe6aLDhCqvGXY';
      }, 1500);
    }

    window.onload = () => {
      document.getElementById('mainEditor').value = files[0].content;
      console.log('%c[OST Visual Studio] Deep features loaded', 'color:#34d399');
    };
  </script>

</body>
</html>
