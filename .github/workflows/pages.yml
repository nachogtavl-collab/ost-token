name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # Refresh Polymarket/Kalshi snapshot data every 15 minutes so
    # prediction markets never look stale between code pushes.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Best-effort: a failed snapshot must NEVER block the deploy
      # (this step previously failed and was removed entirely; the site
      # falls back to live client-side fetches when the file is missing).
      - name: Build prediction market snapshot
        run: node ./scripts/fetch-prediction-market-snapshot.js
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4