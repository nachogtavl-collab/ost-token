[package]
name = "ost-token"
version = "0.1.0"
description = "OST (Out-of-Space Token) — SPL Token-2022 with Confidential Transfers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ost_token"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31", features = ["init-if-needed"] }
anchor-spl = { version = "0.31", features = ["token_2022"] }
spl-token-2022 = { version = "7", features = ["no-entrypoint"] }
