[package]
name = "ost-betting"
version = "0.1.0"
description = "OST on-chain betting markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ost_betting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.31", features = ["init-if-needed"] }
# token_interface: same CPIs work for classic SPL Token AND Token-2022 (OST).
anchor-spl = { version = "0.31", features = ["token_2022"] }
