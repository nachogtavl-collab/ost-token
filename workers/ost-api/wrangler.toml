name = "ost-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
# Required by @solana/web3.js (Buffer / Node crypto shims). Added for the
# server-side pool signer (wallet-payouts.js) — verify with `wrangler dev
# --local` that this doesn't regress the existing Durable Object / D1 bindings
# before relying on it.
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

# Workers AI - powers the OST Ghost companion chat (free tier, no API key)
[ai]
binding = "AI"

# KV namespace for shared positions, launchpad coins, round prices.
# Created 2026-04-28; binding name MUST stay "OST_KV" to match src/index.js.
[[kv_namespaces]]
binding = "OST_KV"
id = "fb5ef8073fd5408fa2d7336e7e0b9fd8"

# ---- Storage backup chain (see ostStore in src/index.js) ----------------------
# KV free tier is ~1k writes/day PER ACCOUNT — extra KV namespaces do NOT add
# quota, so a "backup KV" would die at the same moment as the primary. D1 has a
# SEPARATE, far larger quota (~100k row-writes/day free), so it is the real
# failover tier when KV is exhausted or erroring.
[[d1_databases]]
binding = "DB"
database_name = "ost-backup"
database_id = "3bc7592b-af4f-46a5-9b8f-d15553bc9915"

# Optional deepest tier — enable R2 in the dashboard, create the bucket, then
# uncomment. ostStore picks it up automatically if the binding exists.
# [[r2_buckets]]
# binding = "BACKUP_R2"
# bucket_name = "ost-backup"

[[durable_objects.bindings]]
name = "MESH_HUB"
class_name = "MeshHub"

[[durable_objects.bindings]]
name = "FAUCET_GATE"
class_name = "FaucetGate"

[[durable_objects.bindings]]
name = "NATIVE_MARKET_HUB"
class_name = "NativeMarketHub"

[[durable_objects.bindings]]
name = "REALTIME_HUB"
class_name = "RealtimeHub"

[[durable_objects.bindings]]
name = "PAYOUT_GATE"
class_name = "PayoutGate"

[[durable_objects.bindings]]
name = "GAME_SEED_HUB"
class_name = "GameSeedHub"

[[durable_objects.bindings]]
name = "PLAY_LEDGER"
class_name = "PlayLedger"

[[durable_objects.bindings]]
name = "PURCHASE_LEDGER"
class_name = "PurchaseLedger"

[[durable_objects.bindings]]
name = "AD_TREASURY"
class_name = "AdTreasury"

[[durable_objects.bindings]]
name = "LOAN_LEDGER"
class_name = "LoanLedger"

[[durable_objects.bindings]]
name = "PREDICTION_LEDGER"
class_name = "PredictionLedger"

[[migrations]]
tag = "mesh_hub_v1"
new_sqlite_classes = ["MeshHub"]

[[migrations]]
tag = "faucet_gate_v1"
new_sqlite_classes = ["FaucetGate"]

[[migrations]]
tag = "native_market_hub_v1"
new_sqlite_classes = ["NativeMarketHub"]

[[migrations]]
tag = "realtime_hub_v1"
new_sqlite_classes = ["RealtimeHub"]

[[migrations]]
tag = "payout_gate_v1"
new_sqlite_classes = ["PayoutGate"]

[[migrations]]
tag = "game_seed_hub_v1"
new_sqlite_classes = ["GameSeedHub"]

[[migrations]]
tag = "play_ledger_v1"
new_sqlite_classes = ["PlayLedger"]

[[migrations]]
tag = "purchase_ledger_v1"
new_sqlite_classes = ["PurchaseLedger"]

[[migrations]]
tag = "ad_treasury_v1"
new_sqlite_classes = ["AdTreasury"]

[[migrations]]
tag = "loan_ledger_v1"
new_sqlite_classes = ["LoanLedger"]

[[migrations]]
tag = "prediction_ledger_v1"
new_sqlite_classes = ["PredictionLedger"]

[vars]
GAMMA_BASE = "https://gamma-api.polymarket.com"
CLOB_BASE  = "https://clob.polymarket.com"
DATA_BASE  = "https://data-api.polymarket.com"

# ---- Top-Up (real-money OST refill) ----
# Public site URL Stripe uses for success/cancel redirects.
PUBLIC_SITE_URL = "https://nachogtavl-collab.github.io/ost-token/"
# Mainnet receivers shown in the crypto modal (override per env).
TREASURY_USDC_MAINNET = "Fm7ErbkWzPMpqJ2MdT2LR1oyAHNMvAQxmCXVM7KxGRrM"
TREASURY_SOL_MAINNET  = "Fm7ErbkWzPMpqJ2MdT2LR1oyAHNMvAQxmCXVM7KxGRrM"
# Devnet OST mint (Token-2022). Source of truth: mint-info.json.
OST_MINT = "383pTzoZ8Gp83dzk23ZnvLcfX2Sq32TAGN48CMQu2pAJ"

# Jurisdiction gate. OFF while we are on devnet and nothing moves real money.
# IGNORED on mainnet - the code forces the block on there, so this cannot be
# left "false" by accident at launch. See jurisdictionBlocked() in src/index.js.
GEOBLOCK_ENABLED = "false"

# Credit lines: off | test | live.
#   test = devnet. The MECHANISM is fully real (real line, real provenance,
#          real interest, real repayment, drawn OSTG backed by real pool
#          tokens); the MONEY is test money. This is what paid testers run on.
#   live = mainnet only - the code refuses "live" on any other cluster.
LOANS_MODE = "test"

# OSTG-native predictions. The server owns the position and settles from the
# authoritative round close price (see prediction-ledger.js + /btc/round-result).
# Enabled only after the settlement source was confirmed real end-to-end.
PREDICT_LIVE = "true"

# ---- Server-side pool signer (Phase 0 — see project-docs/TOKEN-ARCHITECTURE.md) ----
# Deploy-time config for /wallet/payout, /wallet/ata-rent, /wallet/cosign.
# These are the AUTHORITATIVE checks — client-side copies are display hints only.
OST_MAX_SINGLE_PAYOUT = "1000000000"
OST_VAULT_MIN_RESERVE = "0"
OST_VAULT_MAX_PAYOUT_FRACTION = "0.02"
OST_VAULT_LOW_WATER = "1000000000"

# Secrets — set via:  npx wrangler secret put STRIPE_SECRET_KEY
#                     npx wrangler secret put STRIPE_WEBHOOK_SECRET
#                     npx wrangler secret put TOPUP_ADMIN_TOKEN
#                     npx wrangler secret put OST_POOL_SECRET_KEY
#                       (paste the JSON array printed by scripts/init-swap-pool.ts —
#                       NEVER commit this value or write it into docs/swap-pool.js)

